name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to packages/mcp/package.json version)"
        required: false
        type: string
      mcpb-sha256:
        description: "sha256 of context7.mcpb on release mcpb-v<version> (leave empty to publish without the mcpb package)"
        required: false
        type: string
  workflow_call:
    inputs:
      mcpb-sha256:
        description: "sha256 of the context7.mcpb that release.yml built"
        required: true
        type: string

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    # Callers of a reusable workflow cannot set environment:, so it is set here.
    environment: release
    permissions:
      id-token: write # Required for OIDC authentication with MCP Registry
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set version in server.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./packages/mcp/package.json').version")
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semver, for example 2.1.0"
            exit 1
          fi
          echo "Publishing version: $VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Add mcpb package to server.json
        env:
          SHA: ${{ inputs.mcpb-sha256 }}
        run: |
          VERSION=$(jq -r .version server.json)
          # Slash-free tag: the registry rejects mcpb URLs whose tag contains '/'
          TAG="mcpb-v$VERSION"
          if [ -n "$SHA" ]; then
            if ! [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::mcpb-sha256 must be 64 lowercase hex characters"
              exit 1
            fi
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG/context7.mcpb"
            jq --arg url "$URL" --arg sha "$SHA" --arg v "$VERSION" '.packages += [{
              "registryType": "mcpb",
              "identifier": $url,
              "version": $v,
              "fileSha256": $sha,
              "transport": { "type": "stdio" },
              "environmentVariables": [{
                "name": "CONTEXT7_API_KEY",
                "description": "API key for authentication",
                "isRequired": false,
                "isSecret": true
              }]
            }]' server.json > server.tmp && mv server.tmp server.json
          else
            echo "::warning::No mcpb-sha256 input — publishing without mcpb package"
          fi

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        # npm can take several minutes to serve a new version after a release,
        # and the registry rejects the publish until it does. Retry that case
        # for up to 10 minutes; fail fast on any other error. Log in before
        # every attempt: the registry token expires after 5 minutes.
        run: |
          for i in $(seq 1 20); do
            ./mcp-publisher login github-oidc
            OUT=$(./mcp-publisher publish 2>&1) && { echo "$OUT"; exit 0; }
            echo "$OUT"
            if echo "$OUT" | grep -q "duplicate version"; then
              echo "This version is already in the registry (versions are immutable) — nothing to do."
              exit 0
            fi
            if ! echo "$OUT" | grep -q "was not found"; then
              exit 1
            fi
            echo "npm does not serve this version yet (${SECONDS}s elapsed, attempt $i/20), retrying in 30s..."
            sleep 30
          done
          exit 1
