name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to package.json version)"
        required: false
        type: string

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication with MCP Registry
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./packages/mcp/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Update package version in server.json
        run: |
          jq --arg version "$VERSION" \
            '.version = $version | (.packages[] | select(.registryType == "npm" and .identifier == "@upstash/context7-mcp").version) = $version' \
            server.json > server.updated.json
          mv server.updated.json server.json

      - name: Install MCP Publisher
        run: |
          curl --fail --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
