name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_CLIENT_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # The release PR is opened and updated with this token when it is
      # configured: pushes made with the default GITHUB_TOKEN don't start CI.
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ steps.app-token.outputs.token || github.token }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcpb:
    name: Upload mcpb Bundle to GitHub Release
    needs: release
    if: needs.release.outputs.published == 'true' && contains(needs.release.outputs.published-packages, '"@upstash/context7-mcp"')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mcpb-sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mcpb bundle
        working-directory: packages/mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v' mcpb/manifest.json > manifest.tmp && mv manifest.tmp mcpb/manifest.json
          npm install -g @anthropic-ai/mcpb
          pnpm run pack-mcpb

      - name: Smoke-test bundle
        working-directory: packages/mcp
        run: |
          unzip -q mcpb/context7.mcpb -d /tmp/mcpb-smoke
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            | node /tmp/mcpb-smoke/server/dist/index.mjs | grep -q '"serverInfo"'

      # The registry gets the hash of the bundle built here, not of the release
      # asset, which anyone with contents: write can replace.
      - name: Hash bundle
        id: sha
        run: echo "sha256=$(sha256sum packages/mcp/mcpb/context7.mcpb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Dedicated slash-free tag: the MCP Registry rejects mcpb URLs whose
        # release tag contains '/', which changesets tags (@scope/pkg@x.y.z) do.
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          TAG="mcpb-v$VERSION"
          gh release view "$TAG" -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create "$TAG" --latest=false \
              --title "context7.mcpb $VERSION" \
              --notes "MCP Bundle for [@upstash/context7-mcp@$VERSION](https://github.com/${{ github.repository }}/releases/tag/%40upstash%2Fcontext7-mcp%40$VERSION)" \
              -R ${{ github.repository }}
          gh release upload "$TAG" packages/mcp/mcpb/context7.mcpb --clobber -R ${{ github.repository }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-mcpb]
    # No workflow runs on tag pushes, so the registry publish must chain off
    # this job directly.
    if: needs.release.outputs.published == 'true' && contains(needs.release.outputs.published-packages, '"@upstash/context7-mcp"')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
    with:
      mcpb-sha256: ${{ needs.publish-mcpb.outputs.mcpb-sha256 }}
